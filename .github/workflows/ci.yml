name: EAON-Gov CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mixed trust span diagnostic
        run: pytest -v -s tests/test_adversarial_corpus.py -k mixed_trust_span_anatomy

      - name: Test
        run: pytest -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/eaon-gov-wheel" .
      - name: Verify installed wheel outside source checkout
        shell: bash
        run: |
          smoke_env="$RUNNER_TEMP/eaon-gov-installed"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check --no-deps --no-index "$RUNNER_TEMP/eaon-gov-wheel/"*.whl
          mkdir -p "$RUNNER_TEMP/eaon-gov-smoke-cwd"
          cd "$RUNNER_TEMP/eaon-gov-smoke-cwd"
          "$smoke_env/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --expected-root "$smoke_env"
